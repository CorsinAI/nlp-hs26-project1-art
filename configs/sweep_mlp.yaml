# W&B grid sweep for Architecture 1 (EmbeddingMLP, shared scorer): 3 x 3 x 2 = 18 runs.
# Run from the repository root:
#   wandb sweep configs/sweep_mlp.yaml
#   wandb agent <entity>/<project>/<sweep_id>
# The agent calls: python src/train.py --arch=mlp --lr=... --hidden_dim=... --dropout=...
program: src/train.py
method: grid
metric:
  name: val_loss   # summary of val_loss = its minimum (see define_metric in train.py)
  goal: minimize
parameters:
  arch:
    value: mlp
  lr:
    values: [0.01, 0.001, 0.0001]
  hidden_dim:
    values: [128, 256, 512]
  dropout:
    values: [0.0, 0.3]
